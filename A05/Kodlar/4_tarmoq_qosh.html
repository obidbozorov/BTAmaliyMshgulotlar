<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>A5 · Testnet tarmoqlari</title>
<style>body{font-family:"Times New Roman",serif;max-width:640px;margin:40px auto;font-size:18px}
button{font-size:17px;padding:10px 16px;margin:6px 6px 6px 0;cursor:pointer}pre{background:#f4f3fa;padding:12px}</style></head>
<body>
<h2>A5 · MetaMask'ga testnet qo'shish</h2>
<button id="ulan">1. Hamyonni ulash</button>
<button data-tarmoq="sepolia">2a. Sepolia</button>
<button data-tarmoq="base">2b. Base Sepolia</button>
<button id="balans">3. Balansni ko'rish</button>
<pre id="chiqish">Natija shu yerda chiqadi…</pre>
<script>
// EIP-3085 (wallet_addEthereumChain) va EIP-3326 (wallet_switchEthereumChain)
const TARMOQLAR = {
  sepolia: { chainId: "0xaa36a7", chainName: "Sepolia",
    nativeCurrency: { name: "Sepolia Ether", symbol: "ETH", decimals: 18 },
    rpcUrls: ["https://ethereum-sepolia-rpc.publicnode.com"], blockExplorerUrls: ["https://sepolia.etherscan.io"] },
  base: { chainId: "0x14a34", chainName: "Base Sepolia",
    nativeCurrency: { name: "Sepolia Ether", symbol: "ETH", decimals: 18 },
    rpcUrls: ["https://sepolia.base.org"], blockExplorerUrls: ["https://sepolia.basescan.org"] }
};
const out = t => document.getElementById("chiqish").textContent = t;
const eth = () => { if (!window.ethereum) throw new Error("MetaMask topilmadi"); return window.ethereum; };

async function ulan() {
  const [hisob] = await eth().request({ method: "eth_requestAccounts" });
  const id = await eth().request({ method: "eth_chainId" });
  out(`Hisob: ${hisob}\nTarmoq chainId: ${parseInt(id, 16)} (${id})`);
}
async function tarmoqqa(nomi) {
  const t = TARMOQLAR[nomi];
  try { await eth().request({ method: "wallet_switchEthereumChain", params: [{ chainId: t.chainId }] }); }
  catch (e) {
    if (e.code !== 4902) throw e;                 // 4902 — tarmoq hamyonda hali yo'q
    await eth().request({ method: "wallet_addEthereumChain", params: [t] });
  }
  out(`${t.chainName} tanlandi. chainId = ${parseInt(t.chainId, 16)}`);
}
async function balans() {
  const [hisob] = await eth().request({ method: "eth_accounts" });
  if (!hisob) return out("Avval hamyonni ulang");
  const wei = BigInt(await eth().request({ method: "eth_getBalance", params: [hisob, "latest"] }));
  const id = parseInt(await eth().request({ method: "eth_chainId" }), 16);
  out(`Hisob: ${hisob}\nchainId: ${id}\nBalans: ${Number(wei) / 1e18} ETH (${wei} wei)`);
}
const xato = f => (...a) => f(...a).catch(e => out("Xato: " + (e.message || e)));
document.getElementById("ulan").onclick = xato(ulan);
document.getElementById("balans").onclick = xato(balans);
document.querySelectorAll("[data-tarmoq]").forEach(b => b.onclick = xato(() => tarmoqqa(b.dataset.tarmoq)));
</script>
</body></html>
